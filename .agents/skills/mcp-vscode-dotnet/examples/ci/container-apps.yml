name: Deploy MCP HTTP to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - "src/CompanyMcp.Tools/**"
      - "src/CompanyMcp.Http/**"
      - "tests/**"
      - ".github/workflows/mcp-container-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION_PATH: "CompanyMcp.slnx"
  STDIO_SERVER_PROJECT: "src/CompanyMcp.Stdio/CompanyMcp.Stdio.csproj"
  STDIO_SMOKE_PROJECT: "tests/CompanyMcp.StdioSmoke/CompanyMcp.StdioSmoke.csproj"
  ACR_NAME: "replacewithyouracr"
  IMAGE_NAME: "company-mcp-http"
  CONTAINER_APP_NAME: "replace-with-your-container-app"
  RESOURCE_GROUP: "replace-with-your-resource-group"

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION_PATH }}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${{ env.SOLUTION_PATH }}" --configuration Release --no-build

      - name: Stdio smoke
        run: >-
          dotnet run --project "${{ env.STDIO_SMOKE_PROJECT }}"
          --configuration Release --no-build --
          "${{ env.STDIO_SERVER_PROJECT }}"

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "${{ env.ACR_NAME }}"

      - name: Build and push image
        run: |
          IMAGE="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -f src/CompanyMcp.Http/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE }}"

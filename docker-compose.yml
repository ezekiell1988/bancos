services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      TZ: America/Costa_Rica
      MSSQL_SA_PASSWORD: "DevLocal_Bancos1!"
    ports:
      - "1433:1433"
    volumes:
      - bancos-sql-data:/var/opt/mssql

volumes:
  bancos-sql-data:
